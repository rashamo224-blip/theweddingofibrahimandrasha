<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Reset Admin Password | Ibrahim & Rasha</title>
    <style>
      :root {
        --ink: #862719;
        --paper: #fff8ef;
        --line: #dcc5a7;
        --text: #4d3a32;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        color: var(--text);
        background: #eee5da;
        font-family: Arial, sans-serif;
      }

      .card {
        width: min(440px, 100%);
        display: grid;
        gap: 18px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 18px 34px rgba(70, 44, 31, 0.18);
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font: 400 clamp(2.2rem, 9vw, 4.2rem) Georgia, "Times New Roman", serif;
        line-height: 0.95;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      label {
        display: grid;
        gap: 7px;
        color: #76645b;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      input {
        min-height: 44px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        color: var(--text);
        background: #fffdf8;
        font: 700 0.95rem Arial, sans-serif;
      }

      button,
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(134, 39, 25, 0.35);
        border-radius: 999px;
        padding: 10px 16px;
        color: var(--paper);
        background: var(--ink);
        text-decoration: none;
        font: 700 0.78rem Arial, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .secondary {
        color: var(--ink);
        background: transparent;
      }

      .message {
        min-height: 1.4em;
        color: var(--ink);
        font-weight: 700;
      }

      .actions {
        display: grid;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div>
        <p>Ibrahim & Rasha Admin</p>
        <h1>Reset Password</h1>
      </div>
      <p id="intro">Enter a new password for the admin account.</p>
      <form class="actions" id="resetForm">
        <label>
          New password
          <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          Confirm password
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <button type="submit">Save Password</button>
      </form>
      <p class="message" id="message" aria-live="polite"></p>
      <a class="secondary" href="passes.html">Back to Admin Login</a>
    </main>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      const supabase = createClient(
        "https://pvskgstowquikczwinwd.supabase.co",
        "sb_publishable_KinKV-BvjxZ3rfcJwO4Ysg_c2asJlvr",
        {
          auth: {
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );

      const message = document.querySelector("#message");
      const form = document.querySelector("#resetForm");
      const password = document.querySelector("#password");
      const confirmPassword = document.querySelector("#confirmPassword");
      const hash = new URLSearchParams(location.hash.slice(1));

      if (hash.get("error_code") === "otp_expired") {
        message.textContent = "This reset link has expired. Please send a new password recovery email from Supabase.";
        form.hidden = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (password.value !== confirmPassword.value) {
          message.textContent = "The passwords do not match.";
          return;
        }

        message.textContent = "Saving new password...";
        const { error } = await supabase.auth.updateUser({ password: password.value });

        if (error) {
          message.textContent = error.message || "Unable to reset password. Please send a new recovery email.";
          return;
        }

        message.textContent = "Password updated. You can now sign in.";
        form.hidden = true;
        await supabase.auth.signOut();
      });
    </script>
  </body>
</html>
